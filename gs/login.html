<div id="login-view" class="vh-100 d-flex justify-content-center align-items-center" 
     style="background: linear-gradient(135deg, #1a237e 0%, #0d47a1 100%);">
  
  <div class="card shadow-lg border-0" style="width: 100%; max-width: 400px; border-radius: 15px;">
    <div class="card-body p-5">
      
      <div class="text-center mb-4">
        <div class="bg-primary bg-opacity-10 text-primary rounded-circle d-inline-flex align-items-center justify-content-center mb-3" style="width: 70px; height: 70px;">
          <i class="fa-solid fa-mobile-screen-button fs-2"></i>
        </div>
        <h4 class="fw-bold text-dark">Admin Login</h4>
        <p class="text-muted small">Silakan masuk untuk mengelola data.</p>
      </div>

      <form id="formLogin" onsubmit="handleLogin(event)">
        
        <div class="mb-3">
          <label class="form-label small fw-bold text-secondary">Username</label>
          <div class="input-group">
            <span class="input-group-text bg-light border-end-0"><i class="fa-regular fa-user text-muted"></i></span>
            <input type="text" class="form-control bg-light border-start-0" id="loginUser" placeholder="admin" required>
          </div>
        </div>

        <div class="mb-4">
          <label class="form-label small fw-bold text-secondary">Password</label>
          <div class="input-group">
            <span class="input-group-text bg-light border-end-0"><i class="fa-solid fa-lock text-muted"></i></span>
            <input type="password" class="form-control bg-light border-start-0" id="loginPass" placeholder="••••••" required>
            <button class="btn btn-light border border-start-0" type="button" onclick="togglePass()">
              <i class="fa-regular fa-eye" id="iconEye"></i>
            </button>
          </div>
        </div>

        <button type="submit" class="btn btn-primary w-100 py-2 fw-bold shadow-sm" id="btnLogin">
          MASUK
        </button>

      </form>

      <div class="text-center mt-4">
        <small class="text-muted">Mobilecell Admin System v1.0</small>
      </div>

    </div>
  </div>
</div>
