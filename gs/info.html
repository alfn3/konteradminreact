<div id="view-info" class="d-none page-section">
  
  <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
    <h1 class="h2"><i class="fa-solid fa-bullhorn me-2"></i>Info Pusat</h1>
    <div class="btn-toolbar mb-2 mb-md-0">
      
      <button type="button" class="btn btn-success me-2" onclick="bukaModalInfo()">
        <i class="fa-solid fa-plus me-1"></i> Buat Info
      </button>

      <button type="button" class="btn btn-primary" onclick="loadDataInfo()">
        <i class="fa-solid fa-arrows-rotate"></i>
      </button>
    </div>
  </div>

  <div id="loadingInfo" class="text-center my-5 d-none">
    <div class="spinner-border text-primary" role="status"><span class="visually-hidden">Loading...</span></div>
  </div>

  <div class="card shadow-sm" id="tableContainerInfo">
    <div class="card-body p-0">
      <div class="table-responsive">
        <table class="table table-hover table-striped align-middle mb-0">
          <thead class="table-dark">
            <tr>
              <th style="width: 15%;" class="text-center">Tanggal</th>
              <th style="width: 60%;">Isi Informasi</th>
              <th style="width: 10%;" class="text-center">Status</th>
              <th style="width: 15%;" class="text-center">Aksi</th>
            </tr>
          </thead>
          <tbody id="tableBodyInfo"></tbody>
        </table>
      </div>
    </div>
  </div>

  <div class="modal fade" id="modalFormInfo" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header bg-info text-dark">
          <h5 class="modal-title fw-bold" id="judulModalInfo">Form Info</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <form id="formInfo">
            <input type="hidden" id="infoMode">
            <input type="hidden" id="infoIndex">
            
            <div class="mb-3">
              <label class="form-label fw-bold">Tanggal</label>
              <input type="date" class="form-control" id="i_tanggal">
            </div>

            <div class="mb-3">
              <label class="form-label fw-bold">Isi Pesan / Info</label>
              <textarea class="form-control" id="i_text" rows="4" placeholder="Tulis pengumuman di sini..."></textarea>
            </div>

            <div class="mb-3">
              <label class="form-label fw-bold d-block">Status Info</label>
              
              <div class="form-check form-switch">
                <input class="form-check-input" type="checkbox" role="switch" id="i_aktif" style="width: 3em; height: 1.5em; cursor: pointer;">
                <label class="form-check-label ms-2 mt-1" for="i_aktif">
                  Geser untuk <b>ON/OFF</b>
                </label>
              </div>
              <div class="form-text small">Jika ON, info akan tampil di aplikasi pengguna.</div>
            </div>

          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Batal</button>
          <button type="button" class="btn btn-primary" onclick="simpanInfo()">
            <i class="fa-solid fa-paper-plane me-1"></i> Posting
          </button>
        </div>
      </div>
    </div>
  </div>

</div>
