// --- LOGIKA LOGIN ---
  function handleLogin(e) {
    e.preventDefault(); // Mencegah reload halaman

    const user = document.getElementById('loginUser').value;
    const pass = document.getElementById('loginPass').value;
    const btn = document.getElementById('btnLogin');

    // Loading State
    const oriText = btn.innerHTML;
    btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Loading...';
    btn.disabled = true;

    google.script.run
      .withSuccessHandler((res) => {
         if (res.success) {
           // LOGIN SUKSES
           
           // 1. Sembunyikan Login, Tampilkan Dashboard
           document.getElementById('login-view').classList.add('d-none');
           document.getElementById('main-app').classList.remove('d-none'); // Munculkan Dashboard
           
          switchPage('dashboard'); // Buka Dashboard Home

           // 3. Notifikasi Selamat Datang
           const Toast = Swal.mixin({
              toast: true, position: 'top-end', showConfirmButton: false, timer: 3000,
              didOpen: (toast) => { toast.addEventListener('mouseenter', Swal.stopTimer); toast.addEventListener('mouseleave', Swal.resumeTimer); }
           });
           Toast.fire({ icon: 'success', title: 'Selamat Datang, Admin!' });

         } else {
           // LOGIN GAGAL
           Swal.fire('Gagal', res.message, 'error');
           btn.innerHTML = oriText;
           btn.disabled = false;
         }
      })
      .withFailureHandler((err) => {
         Swal.fire('Error Sistem', err, 'error');
         btn.innerHTML = oriText;
         btn.disabled = false;
      })
      .checkLogin({username: user, password: pass});
  }

  // Fitur Lihat Password
  function togglePass() {
    const input = document.getElementById('loginPass');
    const icon = document.getElementById('iconEye');
    if (input.type === "password") {
      input.type = "text";
      icon.classList.remove('fa-eye');
      icon.classList.add('fa-eye-slash');
    } else {
      input.type = "password";
      icon.classList.remove('fa-eye-slash');
      icon.classList.add('fa-eye');
    }
  }

// ==========================================

  // ==========================================
  function handleLogout() {
    Swal.fire({
      title: 'Sign Out?',
      text: "Apakah Anda yakin ingin keluar dari aplikasi?",
      icon: 'warning',
      showCancelButton: true,
      confirmButtonColor: '#d33', // Merah
      cancelButtonColor: '#3085d6', // Biru
      confirmButtonText: 'Ya, Keluar',
      cancelButtonText: 'Batal'
    }).then((result) => {
      if (result.isConfirmed) {
        
        // 1. Tampilkan Loading sebentar (Efek visual)
        let timerInterval;
        Swal.fire({
          title: 'Sedang keluar...',
          timer: 800,
          timerProgressBar: true,
          didOpen: () => { Swal.showLoading(); },
          willClose: () => { clearInterval(timerInterval); }
        }).then((result) => {
          
          // 2. PROSES LOGOUT UI
          // Sembunyikan Dashboard
          document.getElementById('main-app').classList.add('d-none');
          
          // Munculkan Halaman Login
          document.getElementById('login-view').classList.remove('d-none');
          
          // 3. Reset Form Login
          document.getElementById('formLogin').reset();
          
          // Reset Tombol Login (jika sebelumnya loading)
          const btnLogin = document.getElementById('btnLogin');
          btnLogin.disabled = false;
          btnLogin.innerHTML = 'MASUK';

          // 4. (Opsional) Reset Data di Tabel agar bersih saat login ulang
          // document.getElementById('tableBodyValidasi').innerHTML = '';
          // document.getElementById('tableBodyKonter').innerHTML = '';

  function loadData() {
    const loadingEl = document.getElementById('loading');
    const tableContainerEl = document.getElementById('tableContainer');
    if (loadingEl) loadingEl.classList.remove('d-none');
    if (tableContainerEl) tableContainerEl.classList.add('d-none');
    
    google.script.run
      .withSuccessHandler(renderTable)
      .withFailureHandler(handleError)
      .getDataValidasi();
  }

  function renderTable(response) {
    if (response.error) { handleError(response.message); return; }

    // 1. Simpan Data & Opsi ke Global
    globalData = response.data;
    if (response.options) {
      globalOptions = response.options;
    }

    // 2. Render Tabel (Sama seperti sebelumnya)
    const tableBody = document.getElementById('tableBody');
    const infoText = document.getElementById('totalDataInfo');
    
    if (!tableBody) return; // Safety check

    tableBody.innerHTML = ''; 
    if (globalData.length === 0) {
      tableBody.innerHTML = '<tr><td colspan="7" class="text-center py-4">Data kosong.</td></tr>';
      infoText.innerText = '0 Data';
    } else {
      let html = '';
      globalData.forEach((row, index) => {
        let badgeColor = 'bg-secondary';
        if(row[4] === 'aktif') badgeColor = 'bg-success';
        else if(row[4] === 'tidak aktif') badgeColor = 'bg-danger';

        html += `
          <tr>
            <td class="small">${row[0]}</td>
            <td class="fw-bold text-center">${row[1]}</td>
            <td class="text-center">${row[2]}</td>
            <td class="text-center">${row[3]}</td>
            <td class="text-center"><span class="badge ${badgeColor}">${row[4]}</span></td>
            <td class="text-center">${row[5]}</td>
            <td class="text-center">
              <button class="btn btn-sm btn-outline-primary me-1" onclick="bukaModalEdit(${index})">
                <i class="fa-solid fa-pen-to-square"></i>
              </button>
              <button class="btn btn-sm btn-outline-danger" onclick="konfirmasiHapus(${index}, '${row[1]}')">
                <i class="fa-solid fa-trash"></i>
              </button>
            </td>
          </tr>
        `;
      });
      tableBody.innerHTML = html;
      infoText.innerText = `Total ${globalData.length} data.`;
    }

    document.getElementById('loading').classList.add('d-none');
    document.getElementById('tableContainer').classList.remove('d-none');
  }

  // --- LOGIKA EDIT & POPULATE DROPDOWN ---
  
  // Fungsi pembantu untuk mengisi <select>
  function populateSelect(elementId, optionsArray, currentValue) {
    const select = document.getElementById(elementId);
    if (!select) return;

    select.innerHTML = ''; // Kosongkan dulu
    
    // Pastikan currentValue ada di opsi (jika sheet punya nilai aneh yang belum terdaftar)
    let finalOptions = [...optionsArray];
    if (currentValue && !finalOptions.includes(currentValue)) {
      finalOptions.push(currentValue);
    }

    finalOptions.forEach(opt => {
      let option = document.createElement("option");
      option.value = opt;
      option.text = opt;
      if (opt === currentValue) option.selected = true;
      select.appendChild(option);
    });
  }

  function bukaModalEdit(index) {
    const data = globalData[index];
    
    if (!modalEditInstance) {
        const el = document.getElementById('modalEdit');
        if(el) modalEditInstance = new bootstrap.Modal(el);
        else return alert("Modal error");
    }

    document.getElementById('editRowIndex').value = index;
    document.getElementById('editEmail').value = data[0];
    document.getElementById('editNama').value = data[1];

    // --- ISI DROPDOWN SECARA DINAMIS ---
    // Parameter: ID Element, Array Opsi dari Backend, Nilai Saat Ini di Tabel
    populateSelect('editShift', globalOptions.shift, data[2]); 
    populateSelect('editKonter', globalOptions.konter, data[3]);
    populateSelect('editStatus', globalOptions.status, data[4]);

    modalEditInstance.show();
  }

  function simpanEdit() {
    const index = document.getElementById('editRowIndex').value;
    
    const dataUpdate = {
      index: index,
      nama: document.getElementById('editNama').value,
      shift: document.getElementById('editShift').value,
      konter: document.getElementById('editKonter').value,
      status: document.getElementById('editStatus').value
    };

    // UI Loading pada tombol Simpan
    const btnSimpan = document.querySelector('#modalEdit .btn-primary');
    const oriText = btnSimpan.innerHTML;
    btnSimpan.disabled = true;
    btnSimpan.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Menyimpan...';

    google.script.run
      .withSuccessHandler((res) => {
         // Tutup Modal Form Edit dulu
         if(modalEditInstance) modalEditInstance.hide();
         
         // --- GANTI ALERT DENGAN SWEETALERT POPUP ---
         Swal.fire({
           icon: 'success',            // Ikon Ceklis Hijau
           title: 'Berhasil!',
           text: res,                  // Pesan dari Backend
           showConfirmButton: false,   // Hilangkan tombol OK biar bersih
           timer: 1500                 // Otomatis tutup dalam 1.5 detik
         });
         // ------------------------------------------

         // Kembalikan tombol simpan
         btnSimpan.disabled = false;
         btnSimpan.innerHTML = oriText;
         
         // Refresh data tabel
         loadData(); 
      })
      .withFailureHandler((err) => {
         // Popup Error (Merah)
         Swal.fire({
           icon: 'error',
           title: 'Gagal!',
           text: err,
         });
         
         btnSimpan.disabled = false;
         btnSimpan.innerHTML = oriText;
      })
      .editDataValidasi(dataUpdate);
  }

function konfirmasiHapus(index, nama) {
    // Popup Konfirmasi Cantik
    Swal.fire({
      title: 'Hapus Data?',
      text: `Anda akan menghapus data milik "${nama}". Aksi ini tidak bisa dibatalkan!`,
      icon: 'warning',
      showCancelButton: true,
      confirmButtonColor: '#d33', // Merah
      cancelButtonColor: '#3085d6', // Biru
      confirmButtonText: 'Ya, Hapus!',
      cancelButtonText: 'Batal'
    }).then((result) => {
      if (result.isConfirmed) {
        
        // Tampilkan loading saat proses hapus
        Swal.fire({
          title: 'Sedang menghapus...',
          didOpen: () => { Swal.showLoading() }
        });

        google.script.run
          .withSuccessHandler(() => {
             // Popup Sukses setelah hapus
             Swal.fire({
               icon: 'success',
               title: 'Terhapus!',
               text: 'Data telah berhasil dihapus.',
               showConfirmButton: false,
               timer: 1500
             });
             loadData(); // Refresh tabel
          })
          .withFailureHandler((err) => {
             Swal.fire('Error', err, 'error');
          })
          .hapusDataValidasi(index);
      }
    });
  }

  function searchTable() {
    var input = document.getElementById("searchInput");
    if (!input) return;
    var filter = input.value.toUpperCase();
    var rows = document.getElementById("tableBody").getElementsByTagName("tr");
    
    for (var i = 0; i < rows.length; i++) {
      var td = rows[i].getElementsByTagName("td")[1]; 
      if (td) {
        var txtValue = td.textContent || td.innerText;
        rows[i].style.display = (txtValue.toUpperCase().indexOf(filter) > -1) ? "" : "none";
      }       
    }
  }

  function toggleSidebar() {
    const sidebar = document.getElementById('sidebarMenu');
    const overlay = document.getElementById('sidebarOverlay');
    
    // Toggle Class 'show'
    sidebar.classList.toggle('show');
    
    if (sidebar.classList.contains('show')) {
      overlay.classList.add('show');
    } else {
      overlay.classList.remove('show');
    }
  }

// ==========================================
  // --- SISTEM NAVIGASI (FINAL FIX) ---
  // ==========================================
  function switchPage(pageName) {
    try {
      // 1. MOBILE: Tutup Sidebar Dulu (Jika di HP)
      if (window.innerWidth < 769) {
         const sidebar = document.getElementById('sidebarMenu');
         const overlay = document.getElementById('sidebarOverlay');
         if(sidebar) sidebar.classList.remove('show');
         if(overlay) overlay.classList.remove('show');
      }

      // 2. VISUAL: Reset Semua Halaman & Link
      document.querySelectorAll('.nav-link').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.page-section').forEach(el => el.classList.add('d-none'));

      // 3. VISUAL: Tampilkan Halaman Target
      const targetPage = document.getElementById('view-' + pageName);
      const targetLink = document.getElementById('link-' + pageName);
      
      if (targetPage) targetPage.classList.remove('d-none');
      if (targetLink) targetLink.classList.add('active');
      else console.warn(`Link menu 'link-${pageName}' tidak ditemukan.`);

      // 4. DATA: Load Data (Gunakan setTimeout agar UI tidak nge-freeze)
      setTimeout(() => {
        
        // --- DASHBOARD ---
        if (pageName === 'dashboard') {
           if(typeof loadDashboard === 'function') loadDashboard();
        }
        
        // --- VALIDASI ---
        else if (pageName === 'validasi') {
           if(typeof loadData === 'function') loadData();
        } 
        
        // --- KONTER ---
        else if (pageName === 'konter') {
           const tbody = document.getElementById('tableBodyKonter');
           if(tbody && tbody.innerHTML.trim() === "") {
              if(typeof loadDataKonter === 'function') loadDataKonter();
           }
        }
        
        // --- INFO PUSAT ---
        else if (pageName === 'info') {
           const tbody = document.getElementById('tableBodyInfo');
           if(tbody && tbody.innerHTML.trim() === "") {
              if(typeof loadDataInfo === 'function') loadDataInfo();
           }
        }
        
        // --- LOG AKTIVITAS ---
        else if (pageName === 'log') {
           const inputLog = document.getElementById('tglLog');
           if(inputLog && !inputLog.value) {
              const dateLog = new Date(); // Ganti 'd' jadi 'dateLog'
              const yyyy = dateLog.getFullYear();
              const mm = String(dateLog.getMonth() + 1).padStart(2, '0');
              const dd = String(dateLog.getDate()).padStart(2, '0');
              inputLog.value = `${yyyy}-${mm}-${dd}`;
              
              if(typeof loadDataLog === 'function') loadDataLog(); 
           }
        }
        
        // --- DATA STOK ---
        else if (pageName === 'stok') {
           if(typeof setTodayDate === "function") setTodayDate(); 
           
           const tabPerdana = document.querySelector('#tab-perdana');
           if(tabPerdana) new bootstrap.Tab(tabPerdana).show();
           
           const tbody = document.getElementById('tbody-perdana');
           if(tbody && tbody.innerHTML.trim() === "") {
             if(typeof loadDataStok === 'function') loadDataStok();
           }
        }
        
        // --- JADWAL JAGA ---
        else if (pageName === 'jadwal') {
           if(typeof loadDataJadwal === 'function') loadDataJadwal();
        }
        
        // --- LAPORAN BULANAN ---
        else if (pageName === 'report') {
           const tabGrafik = document.getElementById('tab-grafik-btn');
           if(tabGrafik) new bootstrap.Tab(tabGrafik).show();
           
           if(typeof generateReportHeader === "function") generateReportHeader(); 
           if(typeof initPageBon === 'function') initPageBon();
        }

      }, 50); // Delay kecil agar animasi sidebar lancar

    } catch (e) {
      console.error("Error Navigasi:", e);
    }
  }

function filterTabelLog() {
  // Ambil nilai dari input pencarian
  let input = document.getElementById("searchInputLog");
  let filter = input.value.toLowerCase();
  
  // Ambil referensi ke tabel dan baris-baris di dalamnya
  let tbody = document.getElementById("tableBodyLog");
  let tr = tbody.getElementsByTagName("tr");

  let hitungTampil = 0;

  // Loop melalui semua baris tabel, sembunyikan yang tidak cocok
  for (let i = 0; i < tr.length; i++) {
    // Ambil seluruh teks dalam satu baris untuk dicari
    let rowText = tr[i].textContent || tr[i].innerText;
    
    if (rowText.toLowerCase().indexOf(filter) > -1) {
      tr[i].style.display = ""; // Tampilkan baris
      hitungTampil++;
    } else {
      tr[i].style.display = "none"; // Sembunyikan baris
    }
  }

  // (Opsional) Update keterangan di footer
  document.getElementById("infoLog").innerText = "Menampilkan " + hitungTampil + " data yang sesuai.";
}

  function loadDashboard() {
    // 1. Set Tanggal Header
    const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
    document.getElementById('dashTanggal').innerText = new Date().toLocaleDateString('id-ID', options);

    // 2. Reset Statistik ke Loading (Skeleton)
    ['stat-konter', 'stat-absen', 'stat-info'].forEach(id => {
       const el = document.getElementById(id);
       if(el) {
         el.classList.add('placeholder-glow');
         el.innerHTML = '<span class="placeholder col-6 rounded"></span>';
       }
    });

    // --- PERBAIKAN DISINI (GANTI LOGIKA LOADING DARI TABEL KE CARD) ---
    const container = document.getElementById('dash-laporan-cards'); // ID BARU
    if (container) {
      // Skeleton untuk Card Grid (Bukan Table Row lagi)
      const skelCard = `
        <div class="col-md-6 col-xl-4">
          <div class="card border-0 shadow-sm rounded-4 h-100">
            <div class="card-body">
              <h5 class="card-title placeholder-glow">
                <span class="placeholder col-6"></span>
              </h5>
              <p class="card-text placeholder-glow">
                <span class="placeholder col-7"></span>
                <span class="placeholder col-4"></span>
                <span class="placeholder col-4"></span>
                <span class="placeholder col-6"></span>
              </p>
            </div>
          </div>
        </div>`;
      
      // Tampilkan 3 kartu loading
      container.innerHTML = skelCard + skelCard + skelCard;
    }
    // ------------------------------------------------------------------

    // 3. Panggil Backend
    google.script.run
      .withSuccessHandler(renderDashboard)
      .withFailureHandler(err => console.log(err))
      .getDashboardStats();
  }

function renderDashboard(res) {
    if(res.error) { console.log(res.message); return; }

    // 1. Update Stats Cards
    updateCardValue("stat-konter", res.stats.konter);
    updateCardValue("stat-absen", res.stats.belumAbsen);
    updateCardValue("stat-info", res.stats.info);
    
    // Update Header Global (Jika ada)
    // ... (kode update header global lainnya biarkan) ...

    // 2. RENDER TANGGAL (UPDATED)
    const lblKemarin = document.getElementById('labelTglKemarin');
    const lblLalu = document.getElementById('labelTglLalu'); // Element Baru

    if(lblKemarin) lblKemarin.innerText = res.tglKemarin || "-";
    if(lblLalu) lblLalu.innerText = res.tglLalu || "-"; // Tampilkan Tgl Bulan Lalu

    // 3. RENDER CARD PER TOKO
    const container = document.getElementById('dash-laporan-cards'); 
    if (!container) return;
    
    container.innerHTML = '';
    
    if(res.laporan.length === 0) {
      container.innerHTML = '<div class="col-12 text-center py-5 text-muted">Belum ada data laporan kemarin.</div>';
    } else {
      res.laporan.forEach(row => {
        // ... (SISA KODE RENDER KARTU SAMA SEPERTI SEBELUMNYA) ...
        // ... Copy paste logika render card di sini ...
        
        // --- CONTOH SINGKAT LOGIKA CARD (PASTIKAN KODE LENGKAPNYA ADA) ---
        if(row.error) return;
        const fmt = (v) => new Intl.NumberFormat('id-ID').format(v);
        
        let selisihHtml = ''; 
        let borderClass = 'border-dark border-start border-1';
        if(row.selisih < 0) { 
           selisihHtml = `<div class="badge bg-danger bg-opacity-10 text-danger border border-danger px-2 py-1 rounded-pill small"><i class="fa-solid fa-triangle-exclamation me-1"></i> Selisih: Rp ${fmt(row.selisih)}</div>`;
        } else if(row.selisih > 0) {
           selisihHtml = `<div class="badge bg-primary bg-opacity-10 text-primary border border-primary px-2 py-1 rounded-pill small"><i class="fa-solid fa-circle-info me-1"></i> Lebih: Rp ${fmt(row.selisih)}</div>`;
        } else {
           selisihHtml = `<div class="badge bg-success bg-opacity-10 text-success border border-success px-2 py-1 rounded-pill small"><i class="fa-solid fa-check-circle me-1"></i> Balance</div>`;
        }

        const getGrowthSmall = (valNow, valPrev) => {
           if(!valNow || !valPrev) return '<span class="text-muted" style="font-size:0.65rem">-</span>';
           const diff = valNow - valPrev;
           const pct = ((diff / valPrev) * 100).toFixed(0);
           if(diff > 0) return `<span class="text-success fw-bold ms-2" style="font-size:0.7rem"><i class="fa-solid fa-arrow-trend-up"></i> ${pct}%</span>`;
           if(diff < 0) return `<span class="text-danger fw-bold ms-2" style="font-size:0.7rem"><i class="fa-solid fa-arrow-trend-down"></i> ${Math.abs(pct)}%</span>`;
           return '';
        };

        let bgIcon = 'bg-dark text-white';
        const nama = row.toko.toLowerCase();
        if(nama.includes('m1')) bgIcon = 'bg-danger';
        else if(nama.includes('m2')) bgIcon = 'bg-warning';
        else if(nama.includes('m3') || nama.includes('toko')) bgIcon = 'bg-success text-dark';
        else if(nama.includes('m4')) bgIcon = 'bg-primary';
        else if(nama.includes('jaya')) bgIcon = 'bg-info text-dark';

        const cardHtml = `
          <div class="col-sm-6 col-lg-4 col-xl-20">
            <div class="card shadow-sm rounded-4 h-100 card-hover ${borderClass}">
              <div class="card-body p-3">
                <div class="d-flex justify-content-between align-items-start mb-3">
                   <div class="d-flex align-items-center">
                      <div class="rounded-circle ${bgIcon} d-flex align-items-center justify-content-center shadow-sm me-2" style="width:40px; height:40px; font-weight:bold; font-size:0.9rem;">
                        ${row.toko.substring(0,2).toUpperCase()}
                      </div>
                      <div style="line-height:1.1;">
                        <h6 class="fw-bold text-dark mb-0" style="font-size:0.9rem;">${row.toko}</h6>
                        <div class="text-muted small d-flex align-items-center">
                           <i class="fa-solid fa-user-clock me-1" style="font-size:0.6rem;"></i> 
                           <span style="font-size:0.7rem;">${row.jaga}</span>
                        </div>
                      </div>
                   </div>
                </div>
                <div class="bg-light rounded-3 p-2 mb-3">
                   <div class="d-flex justify-content-between align-items-end mb-1">
                      <span class="text-muted fw-bold text-uppercase" style="font-size:0.65rem;">Omset</span>
                      <div class="text-end">
                         <div class="fw-bold text-dark" style="font-size:0.85rem;">Rp ${fmt(row.omset)}</div>
                         ${getGrowthSmall(row.omset, row.omsetPrev)}
                      </div>
                   </div>
                   <div class="border-top my-1"></div>
                   <div class="d-flex justify-content-between align-items-end">
                      <span class="text-muted fw-bold text-uppercase" style="font-size:0.65rem;">Margin</span>
                      <div class="text-end">
                         <div class="fw-bold text-success" style="font-size:0.85rem;">Rp ${fmt(row.margin)}</div>
                         ${getGrowthSmall(row.margin, row.marginPrev)}
                      </div>
                   </div>
                </div>
                <div class="text-center">
                   ${selisihHtml}
                </div>
              </div>
            </div>

  // Animasi Angka (Tetap Sama)
  function animateValue(id, start, end, duration) {
    if (start === end) { document.getElementById(id).innerHTML = end; return; }
    const range = end - start;
    let current = start;
    const increment = end > start ? 1 : -1;
    const stepTime = Math.abs(Math.floor(duration / range));
    const obj = document.getElementById(id);
    
    const timer = setInterval(function() {
      current += increment;
      obj.innerHTML = current;
      if (current == end) {
        clearInterval(timer);
      }
    }, stepTime);
  }

  // ==========================================
  // --- FITUR PEMILIH LOKASI (LEAFLET MAPS) ---
  // ==========================================
  
  let mapPicker = null;   // Variabel Peta
  let markerPicker = null; // Variabel Pin/Marker

  function tampilkanPetaPicker() {
    const wrapper = document.getElementById('mapContainerWrapper');
    const inputLat = document.getElementById('k_lat');
    const inputLong = document.getElementById('k_long');
    
    // 1. Munculkan Wadah Peta
    wrapper.classList.remove('d-none');

    // 2. Ambil Nilai dari Input (Format Titik)
    // Jika input kosong, default ke Simpang Lima Semarang (-6.99..., 110.42...)
    let latVal = inputLat.value.replace(',', '.');
    let longVal = inputLong.value.replace(',', '.');

    // Parse ke Float (Angka)
    let curLat = parseFloat(latVal);
    let curLong = parseFloat(longVal);

    // Validasi: Jika Angka tidak valid (NaN), gunakan Default
    if (isNaN(curLat) || isNaN(curLong)) {
       curLat = -6.992363; // Default Latitude
       curLong = 110.417247; // Default Longitude
    }

    // 3. Inisialisasi atau Update Peta
    if (!mapPicker) {
      // --- JIKA PETA BELUM ADA (BUAT BARU) ---
      mapPicker = L.map('mapPicker').setView([curLat, curLong], 16);

      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap contributors'
      }).addTo(mapPicker);

      markerPicker = L.marker([curLat, curLong], {draggable: true}).addTo(mapPicker);

      // Event Geser Marker
      markerPicker.on('dragend', function(e) {
        const position = markerPicker.getLatLng();
        updateInputKoordinat(position.lat, position.lng);
      });

      // Event Klik Peta
      mapPicker.on('click', function(e) {
        markerPicker.setLatLng(e.latlng);
        updateInputKoordinat(e.latlng.lat, e.latlng.lng);
      });

    } else {
      // --- JIKA PETA SUDAH ADA (UPDATE POSISI) ---
      // Pindahkan Marker ke posisi data Edit
      markerPicker.setLatLng([curLat, curLong]);
      
      // Geser Kamera Peta ke posisi Marker
      mapPicker.setView([curLat, curLong], 16);
      
      // PENTING: Render ulang ukuran peta agar tidak abu-abu sebagian
      setTimeout(() => { mapPicker.invalidateSize(); }, 200);
    }
  }

    // Kita gunakan console log agar user tau proses berjalan
    console.log(`Update baris ${index}: ${isChecked}`);

    checkboxEl.disabled = true;

      .withSuccessHandler(() => {
         // Sukses: Aktifkan lagi

         // Notifikasi Toast Kecil (SweetAlert Mixin)
         const Toast = Swal.mixin({
            toast: true, position: 'top-end', showConfirmButton: false, timer: 1000,

         });
         Toast.fire({ icon: 'success', title: 'Koreksi disimpan' });
      })
      .withFailureHandler((err) => {
         // Gagal: Kembalikan status checkbox dan munculkan error
         checkboxEl.checked = !isChecked; // Undo
         checkboxEl.disabled = false;
         Swal.fire('Gagal Update', err, 'error');
      })
      .updateLogKoreksi(index, isChecked);

    var input = document.getElementById("searchLog");
    var filter = input.value.toUpperCase();
    var table = document.getElementById("tableBodyLog");
    var tr = table.getElementsByTagName("tr");
    
    for (var i = 0; i < tr.length; i++) {
      // Cari di semua kolom text (Email, Konter, Produk)
      var rowText = tr[i].innerText || tr[i].textContent;
      
      if (rowText.toUpperCase().indexOf(filter) > -1) {
        tr[i].style.display = "";
      } else {
        tr[i].style.display = "none";
      }       
    }
  }

// --- HELPER: FORMAT INPUT ANGKA (AUTO TITIK) ---
  function formatInputUang(el) {
    // 1. Ambil value saat ini, hapus semua karakter selain angka
    //    (Menghapus titik lama, huruf, dll)
    let rawValue = el.value.replace(/\D/g, ''); 
    
    // 2. Cek jika kosong
    if (rawValue === '') {
      el.value = '';
      return;
    }

    // 3. Format ulang menjadi ribuan Indonesia (1.000.000)
    //    parseInt digunakan agar angka '0' di depan hilang (misal: 015 -> 15)
    const numberValue = parseInt(rawValue, 10);
    el.value = new Intl.NumberFormat('id-ID').format(numberValue);
  }

function renderPengeluaran(data) {
  const tbody = document.getElementById('tbody-pengeluaran');
  let html = '';
  
  if (!data || data.length === 0) {
    html = '<tr><td colspan="4" class="text-center text-muted">Kosong</td></tr>';
  } else {
    data.forEach((row, index) => {
      
      const rawVal = String(row.nominal);

        // --- 1. LOGIKA DETEKSI MINUS YANG LEBIH KUAT ---
        // Cek apakah ada tanda minus (-), dash (–), atau kurung akuntansi (500)
        let isNegative = false;
        if (rawVal.includes('-') || rawVal.includes('–') || (rawVal.includes('(') && rawVal.includes(')'))) {
            isNegative = true;
        }

        // --- 2. AMBIL ANGKA MURNI ---
        // Hapus semua karakter selain angka
        let num = parseInt(rawVal.replace(/\D/g, '')) || 0;

        // Jika terdeteksi negatif, kalikan -1
        if (isNegative && num > 0) {
            num = num * -1;
        }
        // -----------------------------------------------

        // 3. LOGIKA TAMPILAN & WARNA
        let displayNominal = '';
        let textClass = 'text-dark'; // Default Hitam

        if (num !== 0) {
           // Intl.NumberFormat akan otomatis memberi tanda minus (-) jika angka negatif
           const fmt = new Intl.NumberFormat('id-ID').format(num);
           
           if (num < 0) {
              textClass = 'text-danger'; // Warna MERAH
           }
           
           displayNominal = `Rp ${fmt}`;
        }

        // 4. TOMBOL EDIT
        let btnEdit = '-';
        if (isHistoryActive) {
           // Kirim nilai 'num' (yang sudah +/-) ke modal
           btnEdit = `<button class="btn btn-sm btn-outline-danger py-0" 
                        onclick="bukaModalPengeluaran(${row.row}, '${num}', '${row.keterangan || ''}')">
                        <i class="fa-solid fa-pen"></i>
                      </button>`;
        } else {
           btnEdit = `<i class="fa-solid fa-lock text-muted small" title="Terkunci"></i>`;
        }

        html += `
          <tr>
            <td class="text-center align-middle">${row.row}</td>
            <td class="text-end align-middle px-3 fw-bold ${textClass}">
               ${displayNominal}
            </td>
            <td class="small text-center align-middle">${row.keterangan || '-'}</td>
            <td class="text-center align-middle">${btnEdit}</td>
          </tr>`;
      });
    }

    tbody.innerHTML = html;
  }

function renderUang(data) {

    if(!data || data.length === 0) {

// --- RENDER SALDO ELEKTRIK (DENGAN RP & TITIK) ---
  function renderElektrik(data) {
    const tbody = document.getElementById('tbody-elektrik');
    
    if(!data || data.length === 0) {
       tbody.innerHTML = '<tr><td colspan="4">Data Error</td></tr>';
       return;

    const row = data[0];
    
    // Helper Clean Angka Murni (untuk stok data)
    const clean = (val) => String(val).replace(/[^0-9-]/g, ''); 
    
    const awalRaw = clean(row.saldoAwal);
    const topupRaw = clean(row.topup);
    const akhirRaw = row.saldoAkhir || 0;

    // --- FORMAT ANGKA AWAL (Agar saat load langsung ada titiknya) ---
    // Jika 0, kosongkan agar input bersih. Jika ada angka, format ID.
    const awalFmt = awalRaw == 0 ? '' : new Intl.NumberFormat('id-ID').format(awalRaw);
    const topupFmt = topupRaw == 0 ? '' : new Intl.NumberFormat('id-ID').format(topupRaw);

    // 1. INPUT SALDO AWAL (Type Text + onkeyup)
    const inputAwal = `
      <div class="input-group input-group-sm">

              id="el_akhir" value="${akhirFmt}" onkeyup="formatInputUang(this)">
         </div>
       `;
    } else {
       // Mode Utama: Teks Biasa (Read Only)
       const fmtAkhir = new Intl.NumberFormat('id-ID').format(clean(akhirRaw));
       displayAkhir = `
         <div class="fw-bold text-dark fs-6">
           <span class="text-muted small me-1">Rp</span>${fmtAkhir}
         </div>
         <input type="hidden" id="el_akhir" value="${akhirRaw}">
       `;
    }

    const html = `
      <tr>
        <td class="p-2 align-middle">${inputAwal}</td>
        <td class="p-2 align-middle">${inputTopup}</td>
        <td class="text-center align-middle bg-light p-2">
           ${displayAkhir}
        </td>
        <td class="text-center align-middle">
           <button class="btn btn-sm btn-primary" onclick="simpanElektrik()">
             <i class="fa-solid fa-floppy-disk me-1"></i> Simpan
           </button>
        </td>

    `;

function renderTableStok(elementId, data) {
    const tbody = document.getElementById(elementId);
    tbody.innerHTML = '';

    if (!data || data.length === 0) {
      tbody.innerHTML = '<tr><td colspan="8" class="text-center text-muted py-4">Tidak ada data.</td></tr>';
      return;
    }

    let html = '';
    data.forEach((row) => {
      
      const cleanNumber = (val) => {
        if(!val) return 0;
        const cleanStr = String(val).replace(/\D/g, ''); 
        return parseInt(cleanStr) || 0;
      };

      const awalNum = cleanNumber(row.stokAwal);
      const topupNum = cleanNumber(row.topup);
      const akhirNum = cleanNumber(row.stokAkhir);
      const hargaNum = cleanNumber(row.harga); 

      // --------------------------------

      const dispAwal = awalNum === 0 ? '' : awalNum;
      const dispTopup = topupNum === 0 ? '' : topupNum;
      
      let dispAkhir = akhirNum;
      if (awalNum === 0 && topupNum === 0) dispAkhir = ''; 

      // FORMAT RUPIAH SEDERHANA (Rata Tengah)
      const formatRupiah = (angka, isBold = false) => {
         if (angka === 0) return '';
         const str = new Intl.NumberFormat('id-ID').format(angka);
         
         // Style font: Rp agak kecil & abu-abu, Angka normal
         const fontStyle = isBold ? 'fw-bold' : ''; 
         
         return `<span class="me-1">Rp</span><span class="${fontStyle}">${str}</span>`;
      };

      const dispHargaHtml = formatRupiah(hargaNum, false); 

      const lakuNum = (awalNum + topupNum) - akhirNum;
      const totalNum = lakuNum * hargaNum;
      
      const dispTotalHtml = formatRupiah(totalNum, true); // Total tetap Bold biar jelas
      const dispLaku = lakuNum === 0 ? '' : lakuNum;

      const rowData = JSON.stringify({
         row: row.realRow,
         nama: row.nama,
         awal: awalNum,
         topup: topupNum,
         akhir: akhirNum,
         harga: hargaNum
      });

      html += `
        <tr>
          <td class="ps-3 fw-bold align-middle text-truncate" style="max-width: 250px;">${row.nama}</td>
          <td class="text-center align-middle fw-bold">${dispAwal}</td>
          <td class="text-center align-middle text-primary fw-bold">${dispTopup}</td>
          <td class="text-center align-middle">${dispAkhir}</td>
          <td class="text-center align-middle text-success">${dispLaku}</td>
          
          <td class="text-center align-middle text-nowrap">${dispHargaHtml}</td>
          
          <td class="text-center align-middle text-nowrap">${dispTotalHtml}</td>
          
          <td class="text-center p-1">
            <button class="btn btn-sm btn-outline-primary" onclick='bukaModalEditStok(${rowData})' title="Edit Stok">
              <i class="fa-solid fa-pen-to-square"></i>
            </button>
          </td>
        </tr>
      `;
    });
    tbody.innerHTML = html;
  }

  // 2. UPDATE processReportQueue (Munculkan Export setelah selesai Load)
  async function processReportQueue(fileList) {
    // ... (Kode pengecekan fileList kosong SAMA) ...
    if(!fileList || fileList.length === 0) {
      document.getElementById('tbody-omset').innerHTML = '<tr><td colspan="20" class="text-center p-3 text-muted">Tidak ada data history.</td></tr>';
      document.getElementById('progressContainer').classList.add('d-none');
      const btn = document.querySelector('#view-report button.btn-primary');
      if(btn) btn.disabled = false;
      return;
    }

    // ... (Looping file SAMA) ...
    const total = fileList.length;
    for (let i = 0; i < total; i++) {
      const file = fileList[i];
      updateProgress(i, total, `Memuat: ${file.date}`);
      await new Promise((resolve) => {
        google.script.run
          .withSuccessHandler((res) => { appendReportRow(file.date, res); resolve(); })
          .withFailureHandler(() => { appendReportRow(file.date, { error: true }); resolve(); })
          .getReportDetail(file.id);
      });
    }

    updateProgress(total, total, "Selesai!");
    
    // Render Visualisasi
    renderReportCharts();
    renderEmployeeIncentiveTabs();
    updateDatalistBon();
    
    // --- BARU: MUNCULKAN TOMBOL EXPORT ---
    const exportGroup = document.getElementById('btnExportGroup');
    if(exportGroup) exportGroup.classList.remove('d-none');

    setTimeout(() => {
       document.getElementById('progressContainer').classList.add('d-none');
       const btn = document.querySelector('#view-report button.btn-primary');
       if(btn) btn.disabled = false;
    }, 1000);
  }

  function updateProgress(current, total, text) {
    const percent = total === 0 ? 0 : Math.round((current / total) * 100);
    const bar = document.getElementById('progressBar');
    if(bar) bar.style.width = `${percent}%`;
    const txtPercent = document.getElementById('progressPercent');
    if(txtPercent) txtPercent.innerText = `${percent}%`;
    const txtStatus = document.getElementById('progressText');
    if(txtStatus) txtStatus.innerText = text;
  }

function appendReportRow(date, result) {
    const tbodyOmset = document.getElementById('tbody-omset');
    const tbodyMargin = document.getElementById('tbody-margin');
    const tbodyTerjual = document.getElementById('tbody-terjual');
    const tbodyOps = document.getElementById('tbody-operasional');
    const tbodyExport = document.getElementById('tbody-export');

    if (result.error) {
      const errRow = `<tr><td class="sticky-col bg-danger text-white">${date}</td><td colspan="20" class="text-danger">Gagal ambil data</td></tr>`;
      if(tbodyOmset) tbodyOmset.insertAdjacentHTML('beforeend', errRow);
      return;
    }

    const rowdata = result.data; // Array Data 75 Kolom
    
    // 1. DATA CHART
    let dailyOmset = 0;
    for(let i=0; i<15; i++) dailyOmset += (parseInt(rowdata[i]) || 0);
    let dailyMargin = 0;
    [30, 31, 32, 33, 34].forEach((idx, storeIdx) => {
       const val = parseInt(rowdata[idx]) || 0;
       dailyMargin += val;
       reportChartData.storeMargin[storeIdx] += val; 
    });
    for(let i=35; i<50; i++) reportTotalItemTerjual += (parseInt(rowdata[i]) || 0);
    reportChartData.labels.push(date);
    reportChartData.omset.push(dailyOmset);
    reportChartData.margin.push(dailyMargin);

    // 2. AGREGASI INSENTIF (FIXED: ADD TO DETECTED EMPLOYEES)
    if (result.insentif && result.insentif.length > 0) {
      result.insentif.forEach(ins => {
        const nama = ins.nama.trim();
        
        // --- PERBAIKAN UTAMA DISINI ---
        detectedEmployees.add(nama); // Catat nama karyawan
        // ------------------------------
        
        if (!insentifAggregator[nama]) {
           insentifAggregator[nama] = { total: 0, rows: [] };
        }
        insentifAggregator[nama].total += ins.dapat;
        insentifAggregator[nama].rows.push({ 
           tgl: date, 
           toko: ins.toko, 
           detail: ins.detil, 
           dapat: ins.dapat 
        });
      });
    }

    // 3. AGREGASI SELISIH & JAGA
    const mapToko = [
      { nama: 'M1', selisih: [65, 66], jaga: [55, 56] }, 
      { nama: 'M2', selisih: [67, 68], jaga: [57, 58] },
      { nama: 'M3', selisih: [69, 70], jaga: [59, 60] },
      { nama: 'M4', selisih: [71, 72], jaga: [61, 62] },
      { nama: 'JY', selisih: [73, 74], jaga: [63, 64] }
    ];

    mapToko.forEach(store => {
      for (let i = 0; i < 2; i++) {
         const idxJaga = store.jaga[i];
         const idxSelisih = store.selisih[i];
         const rawNama = rowdata[idxJaga];
         const valSelisih = parseInt(rowdata[idxSelisih]) || 0;
         const shiftLabel = (i === 0) ? 'Pg' : 'Sr';

         if (rawNama && rawNama !== '-' && rawNama !== '0' && rawNama !== '') {
            const names = String(rawNama).split(/[\/&,]| dan /i).map(n=>n.trim()).filter(n=>n);
            const uniqueNames = [...new Set(names)]; 

            if (uniqueNames.length > 0) {
               const perOrang = valSelisih / uniqueNames.length;
               uniqueNames.forEach(n => {
                  if(!hadirAggregator[n]) hadirAggregator[n] = 0;
                  hadirAggregator[n]++;
                  detectedEmployees.add(n);

                  if (valSelisih !== 0) {
                     if(!selisihAggregator[n]) selisihAggregator[n] = 0;
                     selisihAggregator[n] += perOrang;

                     if(!selisihDetailAggregator[n]) selisihDetailAggregator[n] = [];
                     selisihDetailAggregator[n].push({
                        tgl: date,
                        toko: `${store.nama} ${shiftLabel}`,
                        share: perOrang 
                     });
                  }
               });
            }
         }
      }
    });

    // 4. RENDER TABEL HTML
    const fmt = (val, isMoney=false) => {
      if (typeof val === 'number') {
        const color = val < 0 ? 'text-danger fw-bold' : '';
        const txt = isMoney ? new Intl.NumberFormat('id-ID').format(val) : val;
        return `<td class="${color}">${txt}</td>`;
      }
      return `<td>${val || '-'}</td>`;
    };
    
    const createRow = (dataSlice, isMoney) => {
      let h = `<tr><td class="sticky-col fw-bold bg-primary text-white border-end">${date}</td>`;
      dataSlice.forEach(v => h += fmt(v, isMoney));
      h += `</tr>`;
      return h;
    };
    

    if(tbodyOmset) tbodyOmset.insertAdjacentHTML('beforeend', createRow(rowdata.slice(0, 15), true));
    if(tbodyMargin) tbodyMargin.insertAdjacentHTML('beforeend', createRow(rowdata.slice(15, 35), true));
    if(tbodyTerjual) tbodyTerjual.insertAdjacentHTML('beforeend', createRow(rowdata.slice(35, 50), false));

    if(tbodyOps) {
       let opsHtml = `<tr><td class="sticky-col fw-bold bg-primary text-white border-end">${date}</td>`;
       rowdata.slice(50, 55).forEach(v => opsHtml += fmt(v, true));
       rowdata.slice(55, 65).forEach(v => opsHtml += fmt(v, false));
       rowdata.slice(65, 75).forEach(v => opsHtml += fmt(v, true));
       opsHtml += `</tr>`;
       tbodyOps.insertAdjacentHTML('beforeend', opsHtml);
    }

    let insentifString = "";
    if (result.insentif && result.insentif.length > 0) {
       insentifString = result.insentif.map(ins => `${ins.nama}:${ins.dapat}:${ins.toko}`).join('|');
    }
    if(tbodyExport) {
       let exportHtml = `<tr><td>${date}</td>`;
       rowdata.forEach(v => exportHtml += `<td>${v || 0}</td>`);
       // Tambahkan Kolom Rahasia
       exportHtml += `<td>${insentifString}</td>`;
       exportHtml += `</tr>`;
       tbodyExport.insertAdjacentHTML('beforeend', exportHtml);
    }
  }

    if(chartInstanceStore) chartInstanceStore.destroy();

    // 1. GRAFIK TREN (LINE CHART)
    const ctxTrend = document.getElementById('chartTrend').getContext('2d');
    
    // Buat Gradient Warna
    const gradOmset = ctxTrend.createLinearGradient(0, 0, 0, 400);
    gradOmset.addColorStop(0, 'rgba(13, 110, 253, 0.5)'); // Biru Transparan
    gradOmset.addColorStop(1, 'rgba(13, 110, 253, 0.0)');

    const gradMargin = ctxTrend.createLinearGradient(0, 0, 0, 400);
    gradMargin.addColorStop(0, 'rgba(25, 135, 84, 0.5)'); // Hijau Transparan
    gradMargin.addColorStop(1, 'rgba(25, 135, 84, 0.0)');

    chartInstanceTrend = new Chart(ctxTrend, {
      type: 'line',
      data: {
        labels: reportChartData.labels, // Array Tanggal
        datasets: [
          {
            label: 'Total Omset',
            data: reportChartData.omset,
            borderColor: '#0d6efd', // Biru Bootstrap
            backgroundColor: gradOmset,
            borderWidth: 2,
            pointRadius: 2,
            fill: true,
            tension: 0.3 // Garis lengkung halus
          },
          {
            label: 'Total Margin',
            data: reportChartData.margin,
            borderColor: '#198754', // Hijau Bootstrap
            backgroundColor: gradMargin,
            borderWidth: 2,
            pointRadius: 2,
            fill: true,
            tension: 0.3
          }
        ]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        interaction: { mode: 'index', intersect: false },
        plugins: {
          legend: { position: 'top' },
          tooltip: {
             callbacks: {
                label: function(ctx) {
                   return ctx.dataset.label + ': Rp ' + new Intl.NumberFormat('id-ID').format(ctx.raw);
                }
             }
          }
        },
        scales: {
          y: { beginAtZero: true, grid: { borderDash: [2, 4] } },
          x: { grid: { display: false } }
        }
      }
    });

    // 2. GRAFIK TOKO (DOUGHNUT CHART)
    const ctxStore = document.getElementById('chartStore').getContext('2d');

    const storeColors = ['#0d6efd', '#6610f2', '#fd7e14', '#dc3545', '#0dcaf0'];

    chartInstanceStore = new Chart(ctxStore, {
      type: 'doughnut',
      data: {
        labels: storeLabels,
        datasets: [{
          data: reportChartData.storeMargin, // Array Total Margin per Toko
          backgroundColor: storeColors,
          borderWidth: 0,
          hoverOffset: 10
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: { position: 'right', labels: { boxWidth: 12, font: {size: 11} } },
          tooltip: {
             callbacks: {
                label: function(ctx) {
                   const val = ctx.raw;
                   const total = ctx.chart._metasets[ctx.datasetIndex].total;
                   const percentage = ((val / total) * 100).toFixed(1) + '%';
                   return ctx.label + ': Rp ' + new Intl.NumberFormat('id-ID').format(val) + ' (' + percentage + ')';
                }
             }
          }
        }
      }

  // VARIABEL GLOBAL BARU (Untuk simpan data slip sementara)
  let currentSlipData = {}; // { "Zain": {objData}, "Irfan": {objData} }

function generateSlipCards(mapGaji, mapBon) {
    const container = document.getElementById('slipContainer');
    container.innerHTML = '';
    currentSlipData = {}; // Reset data penampung untuk cetak

    const normalize = (str) => String(str).trim().toLowerCase();

const findVal = (sourceObj, nameKey) => {
    const foundKey = Object.keys(sourceObj).find(k => normalize(k) === nameKey);
    if (!foundKey) return 0;
    
    const val = sourceObj[foundKey];
    // Jika val adalah objek {total: ...}, ambil totalnya. Jika angka, ambil langsung.
    if (typeof val === 'object' && val.total !== undefined) return Number(val.total) || 0;
    return Number(val) || 0;
};

    // Helper khusus ambil data gaji & hadir manual dari database
    const findGaji = (keyName) => {
        const foundKey = Object.keys(mapGaji).find(k => normalize(k) === keyName);
        // mapGaji[foundKey] sekarang berisi { gapok, tunj, hadir } dari backend
        return foundKey ? mapGaji[foundKey] : { gapok: 0, tunj: 0, hadir: 0 };
    };

    // Gabungkan Nama dari semua sumber
    const allKeys = new Set([
        ...Object.keys(mapGaji).map(normalize), 
        ...Object.keys(mapBon).map(normalize), 
        ...Object.keys(insentifAggregator).map(normalize),
        ...Object.keys(selisihAggregator).map(normalize), 
        ...Object.keys(hadirAggregator).map(normalize)
    ]);

    if (allKeys.size === 0) {
        container.innerHTML = '<div class="col-12 text-center py-5 text-muted">Tidak ada data. Klik "Hitung" terlebih dahulu.</div>'; 
        return;
    }

    const sortedKeys = Array.from(allKeys).sort();

    sortedKeys.forEach(key => {
        // Tentukan Nama Tampilan
        let displayName = key.charAt(0).toUpperCase() + key.slice(1); 
        const matchGaji = Object.keys(mapGaji).find(k => normalize(k) === key);
        if(matchGaji) displayName = matchGaji; // Gunakan nama asli dari database

        // --- PENGAMBILAN DATA ---
        const dataGaji = findGaji(key);
        const gapok    = Number(dataGaji.gapok) || 0;
        const tunj     = Number(dataGaji.tunj) || 0;
        
        // LOGIKA BARU: Prioritas Hadir Manual, jika 0 pakai Otomatis
        const hadirManual = Number(dataGaji.hadir) || 0;
        const hadirOtomatis = findVal(hadirAggregator, key);
        const hadir = hadirManual > 0 ? hadirManual : hadirOtomatis; 

        const insentif = findVal(insentifAggregator, key, true); 
        const selisih  = findVal(selisihAggregator, key); 
        const bon      = findVal(mapBon, key); 

        // Hitung Total Diterima
        const totalTerima = gapok + tunj + insentif + selisih - bon;

        // Tampilkan kartu jika ada data keuangan atau kehadiran
        if (gapok !== 0 || hadir !== 0 || bon !== 0 || insentif !== 0 || selisih !== 0) {
          
          // Simpan ke currentSlipData agar fungsi cetak mengambil data yang SAMA
          currentSlipData[displayName] = {
            nama: displayName, 
            gapok, tunj, 
            ins: Math.floor(insentif),
            bon: Math.floor(bon),
            ketBon: mapBon[normalize(key)]?.ket || "",
            selisih: Math.floor(selisih),
            tot: Math.floor(totalTerima),
            hdr: hadir // Ini yang akan dicetak di slip
          };

          const fmt = (v) => new Intl.NumberFormat('id-ID').format(Math.floor(v));
          const fAbs = (v) => new Intl.NumberFormat('id-ID').format(Math.floor(Math.abs(v)));
          const styleTotal = totalTerima < 0 ? 'text-danger' : 'text-success';
          
          let htmlSelisih = '';
          if (selisih > 0) htmlSelisih = `<li class="list-group-item d-flex justify-content-between px-0 py-1 border-0"><span class="text-primary">Selisih (+)</span><b class="text-primary">Rp ${fmt(selisih)}</b></li>`;
          else if (selisih < 0) htmlSelisih = `<li class="list-group-item d-flex justify-content-between px-0 py-1 border-0"><span class="text-danger">Selisih (-)</span><b class="text-danger">Rp ${fAbs(selisih)}</b></li>`;

          const card = `
            <div class="col-md-6 col-xl-4">
              <div class="card shadow-sm border-0 rounded-4 h-100 position-relative">
                <div class="position-absolute top-0 start-0 m-3" style="z-index:5">
                  <input type="checkbox" class="form-check-input border-2 border-dark slip-checkbox" value="${displayName}" style="transform: scale(1.3); cursor: pointer;">
                </div>
                <div class="card-header bg-white border-0 pt-4 text-center">
                   <h5 class="fw-bold mb-0">${displayName}</h5>
                   <span class="badge ${hadirManual > 0 ? 'bg-primary' : 'bg-light text-dark'} border mt-2">
                      Hadir: ${hadir} Hari ${hadirManual > 0 ? '(Manual)' : ''}
                   </span>
                </div>
                <div class="card-body">
                   <ul class="list-group list-group-flush small">
                     <li class="list-group-item d-flex justify-content-between px-0 py-1 border-0"><span class="text-muted">Gaji Pokok</span><b>Rp ${fmt(gapok)}</b></li>
                     <li class="list-group-item d-flex justify-content-between px-0 py-1 border-0"><span class="text-muted">Tunjangan</span><b>Rp ${fmt(tunj)}</b></li>
                     <li class="list-group-item d-flex justify-content-between px-0 py-1 border-0"><span class="text-success">Insentif</span><b class="text-success">Rp ${fmt(insentif)}</b></li>
                     ${htmlSelisih}
                     <li class="list-group-item d-flex justify-content-between px-0 py-1 border-0 mt-2"><span class="text-danger">Bon</span><b class="text-danger">Rp ${fmt(bon)}</b></li>
                     <li class="list-group-item d-flex justify-content-between bg-light mt-3 rounded p-2 align-items-center">
                       <span class="fw-bold text-dark">TOTAL</span> 
                       <span class="fw-bold fs-5 ${styleTotal}">Rp ${fmt(totalTerima)}</span>
                     </li>
                   </ul>
                </div>
                <div class="card-footer bg-white border-0 pb-4 text-center pt-0">
                   <button class="btn btn-dark w-100 rounded-pill shadow-sm fw-bold" onclick='printSingleSelection("${displayName}")'>
                     <i class="fa-solid fa-print me-2"></i> CETAK
                   </button>
                </div>
              </div>
            </div>`;
          container.insertAdjacentHTML('beforeend', card);
        }
    });
}

         const fAbs = (v) => new Intl.NumberFormat('id-ID').format(Math.floor(Math.abs(v)));
         const jumlahHadir = rowdata.hdr || 0;

         // Row Selisih Utama
         let rowSelisih = '';
         if (rowdata.selisih > 0) rowSelisih = `<tr><td>- Selisih (+)</td><td align="right">Rp ${fmt(rowdata.selisih)}</td></tr>`;
         else if (rowdata.selisih < 0) rowSelisih = `<tr><td>- Selisih (-)</td><td align="right" style="color:red;">(Rp ${fAbs(rowdata.selisih)})</td></tr>`;

         // Rincian Detail Selisih
         const normName = String(rowdata.nama).trim().toLowerCase();
         const keyDetail = Object.keys(selisihDetailAggregator).find(k => String(k).trim().toLowerCase() === normName);
         const details = keyDetail ? selisihDetailAggregator[keyDetail] : [];

         details.sort((a,b) => (a.tgl > b.tgl) ? 1 : -1);

         let htmlDetail = '';
         if (details.length > 0) {
            htmlDetail += `<tr><td colspan="2" style="padding-top:4px; font-style:italic; font-size:8pt; text-decoration:underline;">Rincian Selisih:</td></tr>`;
            
            details.forEach(item => {
               // --- FIX LOGIKA TANGGAL ---
               let tglSaja = "??";
               const rawTgl = String(item.tgl);
               
               // Cek format: YYYY-MM-DD atau DD/MM/YYYY
               if (rawTgl.includes('-')) {
                  // Format: 2025-11-29 -> Ambil 29
                  const parts = rawTgl.split('-');
                  if (parts.length === 3) tglSaja = parts[2];
               } else if (rawTgl.includes('/')) {
                  // Format: 29/11/2025 -> Ambil 29
                  const parts = rawTgl.split('/');
                  if (parts.length >= 1) tglSaja = parts[0]; // Biasanya tanggal di depan
               } else {
                  // Format Date Object
                  const d = new Date(item.tgl);
                  if(!isNaN(d.getTime())) tglSaja = String(d.getDate()).padStart(2, '0');
               }
               // --------------------------

               const color = item.share < 0 ? 'red' : 'black';
               const sign = item.share < 0 ? '(-)' : '(+)';
               
               htmlDetail += `
                 <tr>
                   <td style="padding-left:5px; font-size:8pt; color:${color};">Tgl ${tglSaja} (${item.toko})</td>
                   <td style="text-align:right; font-size:8pt; color:${color};">${sign} ${fAbs(item.share)}</td>
                 </tr>`;
            });
         }
         
         let htmlKetBon = '';
         if (rowdata.bon > 0 && rowdata.ketBon) {
            htmlKetBon = `<tr><td colspan="2" style="font-size:7pt; font-style:italic; color:#555; padding-left:10px;">Ket: ${rowdata.ketBon}</td></tr>`;
         }

         // Hapus style width hardcode, biarkan CSS yang handle
         htmlContent += `
          <div class="slip-card-print">
             <div style="text-align:center;">
               <h3>MOBILECELL</h3>
               <p>PERIODE: ${bulanTxt}</p>
             </div>
             <hr style="border-top:1px dashed #000; margin:4px 0;">
             <div style="display:flex; justify-content:space-between; margin-bottom:4px; font-weight:bold;">
                <span>${rowdata.nama}</span>
                <span>Hadir: ${jumlahHadir} Hari</span>
             </div>
             <table style="width:100%;">
               <tr><td>Gaji Pokok</td><td align="right">${fmt(rowdata.gapok)}</td></tr>
               <tr><td>Tunjangan</td><td align="right">${fmt(rowdata.tunj)}</td></tr>
               <tr><td colspan="2" style="padding-top:3px; font-weight:bold;">PENDAPATAN:</td></tr>
               <tr><td>- Insentif Acc</td><td align="right">${fmt(rowdata.ins)}</td></tr>
               ${rowSelisih.includes('(+)') ? rowSelisih : ''}
               
               <tr><td colspan="2" style="padding-top:3px; font-weight:bold;">POTONGAN:</td></tr>
               <tr><td>- Bon / Kasbon</td><td align="right" style="color:red;">(${fmt(rowdata.bon)})</td></tr>
               ${rowdata.ketBon ? `
                <tr>
                  <td colspan="2" style="font-size:7pt; font-style:italic; color:#555; padding-left:10px; line-height:1;">
                    Ket: ${rowdata.ketBon}
                  </td>
                </tr>` : ''}
               ${rowSelisih.includes('(-)') ? rowSelisih : ''}
               
               ${htmlDetail}
             </table>
             <hr style="border-top:1px solid #000; margin:5px 0;">
             <div style="display:flex; justify-content:space-between; font-weight:bold; font-size:11pt;">
               <span>DITERIMA</span><span>Rp ${fmt(rowdata.tot)}</span>
             </div>
             <br>
             <div style="text-align:center; font-size:8pt; margin-top:10px;">
               <p>TTD,<br><br><br>(${rowdata.nama})</p>
             </div>
          </div>
         `;
       }
    });

    area.innerHTML = htmlContent;
    setTimeout(() => { window.print(); }, 500);
  }

function bukaModalGajiConfig() {
  const modal = new bootstrap.Modal(document.getElementById('modalConfigGaji'));
  const tbody = document.getElementById('tbody-config-gaji');
  tbody.innerHTML = '<tr><td colspan="5" class="text-center">Loading...</td></tr>';
  
  google.script.run.withSuccessHandler(rows => {
      tbody.innerHTML = '';
      // Jika data kosong, buat baris kosong default
      if(!rows || rows.length === 0) {
          addRowGaji(); 
      } else {
          // r[0]: Nama, r[1]: Gapok, r[2]: Tunjangan, r[3]: Hadir
          rows.forEach(r => addRowGaji(r[0], r[1], r[2], r[3] || 0));
      }
      modal.show();
  }).getGajiConfig();
}

function addRowGaji(nama='', gapok='', tunj='', hadir=0) {
  const tbody = document.getElementById('tbody-config-gaji');
  const tr = document.createElement('tr');
  tr.innerHTML = `
    <td><input type="text" class="form-control form-control-sm val-nama" value="${nama}" placeholder="Nama"></td>
    <td><input type="number" class="form-control form-control-sm val-gapok" value="${gapok}" placeholder="0"></td>
    <td><input type="number" class="form-control form-control-sm val-tunj" value="${tunj}" placeholder="0"></td>
    <td><input type="number" class="form-control form-control-sm val-hadir" value="${hadir}" placeholder="0" min="0"></td>
    <td class="text-center">
      <button class="btn btn-link text-danger p-0" onclick="this.closest('tr').remove()">
        <i class="fa-solid fa-times"></i>
      </button>
    </td>
  `;
  tbody.appendChild(tr);
}

function simpanConfigGaji() {
  const rows = document.querySelectorAll('#tbody-config-gaji tr');
  const data = [];
  
  rows.forEach(tr => {
      const nama = tr.querySelector('.val-nama').value;
      const gapok = tr.querySelector('.val-gapok').value;
      const tunj = tr.querySelector('.val-tunj').value;
      const hadir = tr.querySelector('.val-hadir').value; // Ambil nilai hadir
      
      if(nama) {
          // Simpan sebagai array 4 kolom

      }

  google.script.run.withSuccessHandler(res => {

}
  
  function importKaryawanFromReport() {
    // 1. Cek apakah ada data nama yg terdeteksi dari Report?
    if(!detectedEmployees || detectedEmployees.size === 0) {
       Swal.fire({
         title: 'Data Kosong',
         text: 'Silakan buka tab "Laporan Bulanan" dan klik "Muat Data" terlebih dahulu agar sistem bisa mendeteksi nama karyawan yang bekerja bulan ini.',
         icon: 'info'
       });
       return;
    }

    // 2. Ambil nama yg sudah ada di tabel config (agar tidak duplikat)
    const existingNames = [];
    document.querySelectorAll('#tbody-config-gaji .val-nama').forEach(el => {
       if(el.value) existingNames.push(el.value.toLowerCase());
    });

    let count = 0;
    
    // 3. Loop nama yang terdeteksi
    detectedEmployees.forEach(nama => {
       // Bersihkan nama
       const cleanName = nama.trim();
       if(cleanName && !existingNames.includes(cleanName.toLowerCase())) {
          addRowGaji(cleanName, 0, 0); // Tambahkan ke tabel modal
          count++;
       }
    });

    if(count > 0) {
       Swal.fire('Sukses', `${count} karyawan baru ditambahkan ke daftar. Silakan isi nominal gaji.`, 'success');
    } else {
       Swal.fire('Info', 'Semua karyawan dari laporan sudah ada di daftar.', 'info');
    }
  }

  // ==========================================
  // --- FITUR EXPORT & IMPORT DATA (CSV/XLS) ---
  // ==========================================

  // 1. EXPORT KE CSV (Lebih Rapi & Kompatibel)
  function exportToCSV() {
    // Gunakan tabel hidden yang sudah berisi data lengkap
    const table = document.getElementById('tableExportFull');
    
    // Cek data
    if(document.getElementById('tbody-export').innerHTML.trim() === "") {
       Swal.fire('Data Kosong', 'Silakan klik "Muat Data" terlebih dahulu.', 'warning'); 
       return; 
    }

    let csv = [];
    const rows = table.querySelectorAll("tr");
    
    for (let i = 0; i < rows.length; i++) {
        let row = [], cols = rows[i].querySelectorAll("td, th");
        
        for (let j = 0; j < cols.length; j++) {
            // Bersihkan data: 
            // 1. Ambil text
            // 2. Ganti kutip dua (") jadi double ("") agar valid CSV
            // 3. Bungkus dengan kutip jika ada koma
            let data = cols[j].innerText.replace(/"/g, '""');
            
            // Jika data mengandung koma, baris baru, atau kutip, bungkus dengan kutip
            if (data.search(/("|,|\n)/g) >= 0) {
                data = '"' + data + '"';
            }
            row.push(data);
        }
        csv.push(row.join(","));
    }

    const csvString = csv.join("\n");
    downloadFile(csvString, 'csv', 'text/csv');
  }

  // 2. EXPORT KE XLS (HTML Method - Cara Lama tapi Visual Bagus)
  function exportToExcel() {
    const table = document.getElementById('tableExportFull');
    if(document.getElementById('tbody-export').innerHTML.trim() === "") {
       Swal.fire('Data Kosong', 'Silakan klik "Muat Data" terlebih dahulu.', 'warning'); 
       return; 
    }
    let html = table.outerHTML.replace(/ /g, '%20');
    downloadFile(html, 'xls', 'application/vnd.ms-excel');
  }

// --- HELPER DOWNLOAD FILE (ANTI-REDIRECT) ---
  function downloadFile(content, ext, mimeType) {
     const today = new Date().toISOString().slice(0,10);
     const fileName = `Laporan_Mobilecell_${today}.${ext}`;
     
     // Gunakan Blob untuk data besar
     const blob = new Blob(["\ufeff", content], { type: mimeType });
     const url = URL.createObjectURL(blob);
     
     const link = document.createElement("a");
     link.href = url;
     link.download = fileName;
     
     // PENTING: Tambahkan target _blank agar tidak menimpa halaman saat ini
     link.target = "_blank"; 
     
     // Sembunyikan & Masukkan ke Body
     link.style.display = 'none';
     document.body.appendChild(link);
     
     // Klik
     link.click();
     
     // Bersihkan memory setelah download dimulai
     setTimeout(() => {
       document.body.removeChild(link);
       URL.revokeObjectURL(url);
     }, 100);
  }


  // ==========================================
  // --- FITUR IMPORT CSV (VIEWER) ---
  // ==========================================

  function processImportCSV(input) {
    const file = input.files[0];
    if (!file) return;

    const reader = new FileReader();
    
    reader.onload = function(e) {
      const text = e.target.result;
      parseCSVAndRender(text);
    };
    
    reader.readAsText(file);
    input.value = ''; // Reset input agar bisa pilih file sama lagi
  }

// ==========================================
  // --- FITUR IMPORT CSV (FIX TANGGAL SPASI) ---
  // ==========================================

  function parseCSVAndRender(csvText) {
    const rows = csvText.split(/\r?\n/);
    if (rows.length === 0) { Swal.fire('Error', 'File CSV kosong.', 'error'); return; }

    // 1. RESET TOTAL
    ['tbody-omset', 'tbody-margin', 'tbody-terjual', 'tbody-operasional', 'tbody-export'].forEach(id => {
       const el = document.getElementById(id); if(el) el.innerHTML = '';
    });

    reportChartData = { labels: [], omset: [], margin: [], storeMargin: [0,0,0,0,0] };
    reportTotalItemTerjual = 0; 
    
    insentifAggregator = {}; selisihAggregator = {}; selisihDetailAggregator = {}; 
    hadirAggregator = {}; plusAggregator = {}; plusDetailAggregator = {}; 
    detectedEmployees = new Set();

    let successCount = 0;

    // 2. LOOPING BARIS CSV
    for (let i = 1; i < rows.length; i++) {
        const rowStr = rows[i];
        if (!rowStr.trim()) continue; 

        // --- PERBAIKAN REGEX DISINI ---
        // Hapus '\s' dari dalam [] agar SPASI tidak dianggap pemisah kolom
        // Lama: /(".*?"|[^",\s]+)(?=\s*,|\s*$)/g
        // Baru: /(".*?"|[^",]+)(?=\s*,|\s*$)/g
        const matches = rowStr.match(/(".*?"|[^",]+)(?=\s*,|\s*$)/g);
        
        if (matches) {
           const cleanCols = matches.map(col => col.replace(/^"|"$/g, '').replace(/""/g, '"'));

           // Kolom 0 = Tanggal ("1 November 2025")
           const date = cleanCols[0];
           
           // Data mulai kolom 1 sampai sebelum kolom terakhir (Backup Insentif)
           // Kolom Terakhir adalah string insentif backup "indun:4000:M1|..."
           const lastColIndex = cleanCols.length - 1;
           const backupString = cleanCols[lastColIndex];
           const dataValues = cleanCols.slice(1, lastColIndex);

           // Restore Insentif dari string backup
           let restoredInsentif = [];
           if (backupString && backupString.includes(':')) {
              const items = backupString.split('|');
              items.forEach(item => {
                 const parts = item.split(':');
                 if(parts.length >= 2) {
                    restoredInsentif.push({
                       nama: parts[0],
                       dapat: parseInt(parts[1]) || 0,
                       toko: parts[2] || 'Backup',
                       detil: 'Imported'
                    });
                 }
              });
           }

           // Panggil fungsi Append
           appendReportRow(date, { 
              data: dataValues,
              insentif: restoredInsentif, 
              error: false
           });
           
           successCount++;
        }
    }

    // 3. UPDATE UI
    if (successCount > 0) {
       renderReportCharts();
       const exportGroup = document.getElementById('exportImportGroup');
       if (exportGroup) exportGroup.classList.remove('d-none');
       
       renderEmployeeIncentiveTabs();
       updateDatalistBon(); 

       Swal.fire({
          icon: 'success',
          title: 'Import Berhasil',
          text: `Berhasil memulihkan ${successCount} data tanggal.`,
          timer: 2000, showConfirmButton: false
       });
    } else {
       Swal.fire('Gagal', 'Format CSV tidak valid.', 'error');
    }
  }
  
  // --- FUNGSI SYNC JADWAL HARIAN ---
  function syncJadwalHarian() {
    Swal.fire({
      title: 'Sinkronisasi Jadwal?',
      text: "Data Shift, Konter, dan Status karyawan akan diperbarui otomatis sesuai Jadwal Jaga hari ini.",
      icon: 'question',
      showCancelButton: true,
      confirmButtonText: 'Ya, Sinkronkan',
      confirmButtonColor: '#198754',
      cancelButtonText: 'Batal'
    }).then((result) => {
      if (result.isConfirmed) {
        
        Swal.fire({title: 'Memproses...', didOpen: () => Swal.showLoading()});
        
        google.script.run
          .withSuccessHandler((msg) => {
             Swal.fire('Sukses', msg, 'success');
             loadData(); // Refresh tabel validasi otomatis
          })
          .withFailureHandler((err) => {
             Swal.fire('Gagal', err, 'error');
          })
          .syncJadwalToValidasi();
      }
    });
  }
