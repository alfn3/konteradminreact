<style>

  /* CSS KHUSUS GRID 5 KOLOM */
  @media (min-width: 1200px) {
    .col-xl-20 {
      flex: 0 0 auto;
      width: 20%; /* 100% bagi 5 = 20% */
    }
  }

  /* STYLE TABEL DASHBOARD PREMIUM */
  .table-dashboard {
    border-collapse: separate; 
    border-spacing: 0;
  }
  
  .table-dashboard thead th {
    background-color: #f8f9fa;
    color: #64748b; /* Warna abu slate */
    font-size: 0.7rem;
    font-weight: 700;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    padding: 15px 20px;
    border-bottom: 1px solid #e2e8f0;
  }

  .table-dashboard tbody td {
    vertical-align: middle;
    padding: 15px 20px; /* Padding lega */
    border-bottom: 1px solid #f1f5f9;
    background: white;
    transition: background 0.2s;
  }
  
  .table-dashboard tbody tr:hover td {
    background-color: #f8fafc; /* Efek hover halus */
  }

  /* Avatar Konter */
  .konter-icon {
    width: 42px;
    height: 42px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 1rem;
    margin-right: 15px;
  }
  
  /* Warna Warni Konter */
  .bg-konter-m1 { background: #e0f2fe; color: #0284c7; }
  .bg-konter-m2 { background: #f0fdf4; color: #16a34a; }
  .bg-konter-m3 { background: #fff7ed; color: #ea580c; }
  .bg-konter-m4 { background: #fef2f2; color: #dc2626; }
  .bg-konter-jy { background: #f3e8ff; color: #9333ea; }

  .card-hover {
  transition: transform 0.2s ease, box-shadow 0.2s ease;
  }
  .card-hover:hover {
    transform: translateY(-5px);
    box-shadow: 0 10px 20px rgba(0,0,0,0.1) !important;
  }
</style>

<div id="view-dashboard" class="page-section">
  
  <div class="d-flex justify-content-between align-items-center pt-3 pb-2 mb-4">
    <div>
      <h2 class="fw-bold text-dark mb-0">Dashboard</h2>
      <p class="text-muted small mb-0">Ringkasan operasional harian.</p>
    </div>
    <span class="badge bg-white text-dark border px-3 py-2 rounded-pill shadow-sm">
      <i class="fa-regular fa-calendar me-2 text-primary"></i> <span id="dashTanggal">...</span>
    </span>
  </div>

  <div class="row g-3 mb-4">
    <div class="col-md-4">
      <div class="card card-dash bg-primary text-white h-100">
        <div class="card-body p-3 d-flex align-items-center justify-content-between">
           <div><h6 class="mb-0 opacity-75">Total Konter</h6><h2 class="fw-bold mb-0" id="stat-konter">0</h2></div>
           <i class="fa-solid fa-shop fs-1 opacity-25"></i>
        </div>
      </div>
    </div>
    <div class="col-md-4">
      <div class="card card-dash bg-warning text-dark h-100">
        <div class="card-body p-3 d-flex align-items-center justify-content-between">
           <div><h6 class="mb-0 opacity-75">Belum Absen</h6><h2 class="fw-bold mb-0" id="stat-absen">0</h2></div>
           <i class="fa-solid fa-user-clock fs-1 opacity-25"></i>
        </div>
      </div>
    </div>
    <div class="col-md-4">
      <div class="card card-dash bg-info text-white h-100">
        <div class="card-body p-3 d-flex align-items-center justify-content-between">
           <div><h6 class="mb-0 opacity-75">Info Tayang</h6><h2 class="fw-bold mb-0" id="stat-info">0</h2></div>
           <i class="fa-solid fa-bullhorn fs-1 opacity-25"></i>
        </div>
      </div>
    </div>
  </div>

<div class="d-flex justify-content-between align-items-end mb-3 mt-4">
    <div>
      <h5 class="fw-bold text-dark mb-0">
        <i class="fa-solid fa-store me-2 text-primary"></i>Performa Outlet Kemarin
      </h5>
      <div class="small text-muted mt-1">
         <i class="fa-regular fa-calendar me-1"></i> Data: <span id="labelTglKemarin" class="fw-bold text-dark">...</span>
         <span class="mx-2 text-secondary opacity-50">|</span>
         <i class="fa-solid fa-code-compare me-1"></i> vs: <span id="labelTglLalu" class="fw-bold text-primary">...</span>
      </div>
    </div>
    <button class="btn btn-sm btn-white border shadow-sm rounded-pill px-3 fw-bold" onclick="loadDashboard()">
      <i class="fa-solid fa-rotate text-primary me-1"></i> Refresh
    </button>
  </div>

  <div id="dash-laporan-cards" class="row g-3">
    <div class="col-md-6 col-xl-4"><div class="card border-0 shadow-sm rounded-4 h-100"><div class="card-body"><span class="placeholder col-6 mb-3"></span><span class="placeholder col-12 mb-2"></span><span class="placeholder col-8"></span></div></div></div>
    <div class="col-md-6 col-xl-4"><div class="card border-0 shadow-sm rounded-4 h-100"><div class="card-body"><span class="placeholder col-6 mb-3"></span><span class="placeholder col-12 mb-2"></span><span class="placeholder col-8"></span></div></div></div>
    <div class="col-md-6 col-xl-4"><div class="card border-0 shadow-sm rounded-4 h-100"><div class="card-body"><span class="placeholder col-6 mb-3"></span><span class="placeholder col-12 mb-2"></span><span class="placeholder col-8"></span></div></div></div>
  </div>

</div>
